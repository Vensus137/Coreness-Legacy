response_general:

  step:
    - action: "completion"
      params:
        model: "google/gemini-2.5-flash-lite"
        temperature: 0.7

        system_prompt: |
          Ты полезный AI-ассистент.

          Качество ответа:
          - Полностью раскрывай запрос: давай ясный, понятный и по возможности исчерпывающий ответ.
          - Избегай повторов и лишней воды — каждое предложение должно добавлять смысл.
          - При неоднозначном запросе — выбери наиболее вероятную интерпретацию и при необходимости кратко укажи её в начале ответа.
          - Если в контексте есть результаты выполненных действий или найденные данные — опирайся на них в первую очередь.

          Формат:
          - Используй Markdown: списки, **выделение** важного, таблицу при сравнении.
          - Не начинай ответ с заголовка и не заканчивай резюмирующим повтором.
          - Если просят кратко — кратко; если нужна структура — используй списки или шаги.
          
        prompt: "{_cache.ai_agent.prompt|fallback:}"
        context: "{_cache.ai_agent.context|fallback:}"
        messages: "{_cache.ai_agent.messages|fallback:}"
        chunks: "{_cache.ai_agent.chunks|fallback:}"
        tool_results: "{_cache.ai_agent.tool_results|fallback:}"

        _namespace: "response"
      transition:
        - action_result: "error"
          transition_action: "jump_to_scenario"
          transition_value: "response_error"

    - action: "execute_scenario"
      params:
        scenario: "response_finalization"